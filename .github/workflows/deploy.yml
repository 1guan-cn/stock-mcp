name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "stock_service/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "ecosystem.config.cjs"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key ${SERVER_USER}@${SERVER_HOST}"
          REMOTE="${SERVER_USER}@${SERVER_HOST}"

          # 同步代码
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.production' \
            --exclude='.claude' \
            --exclude='.mcp.json' \
            ./ "${REMOTE}:${DEPLOY_DIR}/"

          # 安装依赖 → 停服 → 迁移 → 起服 → 刷新另一应用。
          # 顺序要点：
          #   1) 迁移前先停服：破坏性迁移会打到仍在运行的旧进程。2026-10-11 事故即
          #      v11 DROP data_coverage 后旧进程读它就坏，而 restart 又失败 ⇒ 长期故障。
          #   2) `pm2 stop` 在「本来未运行」时返回非 0，这里忽略是安全的（无进程可停）。
          #   3) 迁移失败时服务保持 stopped（明确的失败态），修好迁移重跑部署即可恢复；
          #      迁移引擎已改为整体事务，失败不会留下半迁移 schema。
          #   4) 末尾**不能**挂 `|| true` 兜底：它会把失败伪装成 success（同上事故）。
          $SSH_CMD "export PATH=\"\$HOME/.local/bin:\$PATH\" && \
            export NVM_DIR=\"\$HOME/.nvm\" && [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\" && \
            cd ${DEPLOY_DIR} && \
            uv sync && \
            (pm2 stop stock-service || true) && \
            uv run python scripts/migrate.py && \
            pm2 start ecosystem.config.cjs --update-env && \
            pm2 reload 1guan-template"
